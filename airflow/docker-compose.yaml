version: "3.8"

services:
  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ../etl:/opt/airflow/etl
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.11
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ../etl:/opt/airflow/etl
  airflow-worker:
    image: apache/airflow:2.9.3-python3.11
    command: celery worker
    volumes:
      - ./dags:/opt/airflow/dags
      - ../etl:/opt/airflow/etl
