app = 'mini-attribution-engine'
primary_region = 'yyz'

[build]
  dockerfile = "api/Dockerfile"
  context = "api"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  GCP_PROJECT_ID = "thub-10b72"
  BQ_DATASET = "marketing_demo"
  GOOGLE_APPLICATION_CREDENTIALS = "/app/gcp/service-account.json"
