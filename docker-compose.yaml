version: "3.8"

services:
  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./airflow/airflow.db:/opt/airflow/airflow.db
      - ./airflow/logs:/opt/airflow/logs
      - ./gcp/service-account.json:/run/secrets/gcp-service-account.json:ro
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      PYTHONPATH: /opt/airflow
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-local-demo-project}
      BQ_DATASET: ${BQ_DATASET:-marketing_demo}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-service-account.json

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./airflow/airflow.db:/opt/airflow/airflow.db
      - ./airflow/logs:/opt/airflow/logs
      - ./gcp/service-account.json:/run/secrets/gcp-service-account.json:ro
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-local-demo-project}
      BQ_DATASET: ${BQ_DATASET:-marketing_demo}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-service-account.json

  airflow-worker:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: celery worker
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./airflow/airflow.db:/opt/airflow/airflow.db
      - ./airflow/logs:/opt/airflow/logs
      - ./gcp/service-account.json:/run/secrets/gcp-service-account.json:ro
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-local-demo-project}
      BQ_DATASET: ${BQ_DATASET:-marketing_demo}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-service-account.json

  fastapi:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./ml:/app/ml
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-local-demo-project}
      BQ_DATASET: ${BQ_DATASET:-marketing_demo}
      GCP_CREDS: ${GCP_CREDS}

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: "https://mini-attribution-engine.fly.dev"
    ports:
      - "3000:80"
